name: Compilar APK con Python y Buildozer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # -----------------------------------------
      # 1. Descargar el proyecto
      # -----------------------------------------
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # -----------------------------------------
      # 2. Configurar Python
      # -----------------------------------------
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -----------------------------------------
      # 3. Configurar Java
      # -----------------------------------------
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # -----------------------------------------
      # 4. Instalar dependencias del sistema
      # -----------------------------------------
      - name: Instalar dependencias
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      # -----------------------------------------
      # 5. Instalar Buildozer
      # -----------------------------------------
      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools
          python -m pip install "Cython==0.29.33"
          python -m pip install "buildozer==1.6.0"

      # -----------------------------------------
      # 6. Mostrar versiones
      # -----------------------------------------
      - name: Verificar entorno
        run: |
          python --version
          java -version
          buildozer --version

      # -----------------------------------------
      # 7. Limpiar compilaciones anteriores
      # -----------------------------------------
      - name: Limpiar compilaciones
        run: |
          rm -rf .buildozer
          rm -rf bin

      # -----------------------------------------
      # 8. Compilar APK
      # -----------------------------------------
      - name: Compilar APK
        run: |
          buildozer -v android debug

      # -----------------------------------------
      # 9. Subir APK
      # -----------------------------------------
      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android
          path: bin/*.apk
          if-no-files-found: error
