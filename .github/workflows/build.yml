name: Compilar APK con Python y Buildozer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3-pip build-essential libffi-dev libssl-dev zlib1g-dev

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip setuptools
        pip install Cython==0.29.33 buildozer

    - name: Limpiar compilaciones previas
      run: |
        rm -rf .buildozer build .plat ~/.buildozer

    - name: Compilar APK
      run: |
        export ANDROID_BUILD_TOOLS_VERSION="33.0.2"
        yes | buildozer -v android debug

    - name: Subir el APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-release-android
        path: bin/*.apk
        
