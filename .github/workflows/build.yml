name: Compilar APK con Python y Buildozer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            python3-pip \
            build-essential \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: Compilar APK
      run: |
        yes | python -m buildozer -v android debug
    

    - name: Subir el APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
        
        
        
